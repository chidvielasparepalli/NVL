services:
  - type: web
    name: noval-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noval-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URLS
        sync: false
      - key: NODE_ENV
        value: production
databases:
  - name: noval-db
    plan: basic-256mb