name: Verify NOVAL
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: backend
        run: npm install
      - working-directory: backend
        run: npx prisma generate
      - working-directory: backend
        run: npm run typecheck
      - working-directory: backend
        run: npm run build
